[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lecture-code-review"
version = "0.1.0"
description = "Export student code submissions of a DCU OJ lecture/contest from PostgreSQL to disk for review."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
]

[project.scripts]
lecture-code-review = "lecture_code_review.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lecture_code_review"]
