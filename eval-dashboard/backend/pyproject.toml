[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-dashboard-backend"
version = "0.1.0"
description = "FastAPI backend for eval-dashboard."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.1",
    "python-dotenv>=1.0",
    "sse-starlette>=2.1",
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eval_dashboard"]
